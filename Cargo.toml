[package]
name = "popamp-visual"
description = "Draws Popamp visualizer plug-ins: their shaders on the GPU, every GPU call made by the player"
version = "0.6.0"
edition = "2021"
rust-version = "1.96"
authors = ["Gunyakov <web@gunyakov.pro>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/popamp/popamp-visual"
homepage = "https://github.com/popamp/popamp"
keywords = ["popamp", "visualizer", "wgpu", "wgsl"]
categories = ["multimedia::audio", "rendering"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "parking_lot"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
pollster = "0.4"
raw-window-handle = "0.6"
parking_lot = "0.12"
